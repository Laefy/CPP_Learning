<div
  id="redirect-warning"
  style="
    background-color: orange;
    position: fixed;
    top: 0;
    left: 300px;
    z-index: 999999;
    overflow: hidden;
    width: calc(100% - 300px);
    display: block;
    transform: translateY(-100%);
    transform-origin: top;
    transition: transform 0.5s ease-out;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
  "
>
  ⚠ Si vous êtes un étudiant en Master 1 d'Informatique à l'UPEM, sachez que
  vous n'êtes pas sur le bon site ! ⚠
  <button
    style="position: fixed; right: 10px; background-color: transparent"
    onclick="sessionStorage.setItem('redirect-warning-closed', 'true');
    document.getElementById('redirect-warning').style.transform = 'translateY(-100%)';"
  >
    X
  </button>
</div>

<script>
  setTimeout(() => {
    if (sessionStorage.getItem("redirect-warning-closed") !== "true") {
      document.getElementById("redirect-warning").style.transform =
        "translateY(0)";
    }
  }, 0);
</script>
